<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="t d">
<title id="t">How Imperata works</title><desc id="d">The owner decides on the run board; the Orchestrator delegates to six specialists; the repository holds the run files.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="640" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">How Imperata works</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">One requirement per run. Agents do the work, you make the decisions, the repository keeps the evidence.</tspan></text><rect x="32" y="110" width="168" height="150" rx="12" class="f-owner" stroke-width="1.5"/><g class="m-owner"><circle cx="116" cy="132.04" r="4.4"/><path d="M108.08 145.24a7.92 7.48 0 0 1 15.84 0z"/></g><text x="116" y="158" font-size="15" font-weight="650" text-anchor="middle" class="t-owner"><tspan x="116">You, the owner</tspan></text><text x="116" y="179" font-size="12.5" font-weight="400" text-anchor="middle" class="t-owner"><tspan x="116">answer questions,</tspan><tspan x="116" dy="16.5">approve each gate,</tspan><tspan x="116" dy="16.5">accept the delivery</tspan></text><rect x="278" y="110" width="212" height="150" rx="12" class="f-board" stroke-width="1.5"/><text x="384" y="144" font-size="15" font-weight="650" text-anchor="middle" class="t-board"><tspan x="384">Run board</tspan></text><text x="384" y="165" font-size="12.5" font-weight="400" text-anchor="middle" class="t-board"><tspan x="384">every run at a glance:</tspan><tspan x="384" dy="16.5">question cards, approval</tspan><tspan x="384" dy="16.5">cards, progress</tspan></text><rect x="568" y="110" width="212" height="150" rx="12" class="f-orch" stroke-width="1.5"/><text x="674" y="144" font-size="15" font-weight="650" text-anchor="middle" class="t-orch"><tspan x="674">Orchestrator</tspan></text><text x="674" y="165" font-size="12.5" font-weight="400" text-anchor="middle" class="t-orch"><tspan x="674">plans the run, delegates</tspan><tspan x="674" dy="16.5">one task at a time, checks</tspan><tspan x="674" dy="16.5">every gate, reports</tspan></text><rect x="846" y="96" width="302" height="178" rx="12" class="f-repo" stroke-width="1.5" stroke-dasharray="6 5"/><text x="997" y="118" font-size="12.5" font-weight="650" text-anchor="middle" class="muted"><tspan x="997">Specialists (subagents)</tspan></text><rect x="858" y="130" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="924.5" y="153.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="924.5">Business Analyst</tspan></text><rect x="1003" y="130" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="1069.5" y="153.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="1069.5">UX Designer</tspan></text><rect x="858" y="176" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="924.5" y="199.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="924.5">Architect</tspan></text><rect x="1003" y="176" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="1069.5" y="199.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="1069.5">Developer</tspan></text><rect x="858" y="222" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="924.5" y="245.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="924.5">QA Engineer</tspan></text><rect x="1003" y="222" width="133" height="38" rx="7" class="f-agent" stroke-width="1"/><text x="1069.5" y="245.68" font-size="13" font-weight="600" text-anchor="middle" class="t-agent"><tspan x="1069.5">Code Reviewer</tspan></text><path d="M200 168 L278 168" class="s-owner" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-owner)"/><text x="239" y="156" font-size="12" font-weight="400" text-anchor="middle" class="muted"><tspan x="239">decide</tspan></text><path d="M278 206 L200 206" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="239" y="226" font-size="12" font-weight="400" text-anchor="middle" class="muted"><tspan x="239">your move</tspan></text><path d="M490 185 L568 185" class="s-board" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-board)"/><text x="529" y="173" font-size="12" font-weight="400" text-anchor="middle" class="muted"><tspan x="529">Send</tspan></text><text x="529" y="205" font-size="11.5" font-weight="400" text-anchor="middle" class="muted"><tspan x="529">(or paste)</tspan></text><path d="M780 185 L846 185" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><text x="813" y="173" font-size="12" font-weight="400" text-anchor="middle" class="muted"><tspan x="813">delegates</tspan></text><rect x="32" y="340" width="1116" height="236" rx="14" class="f-repo" stroke-width="1.5"/><text x="52" y="370" font-size="16" font-weight="700" text-anchor="start"><tspan x="52">Your project repository</tspan></text><text x="52" y="392" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="52">every decision and every piece of evidence lives here, in git</tspan></text><text x="52" y="426" font-size="13" font-weight="650" text-anchor="start" class="mono"><tspan x="52">sdlc/runs/&lt;runId&gt;/</tspan></text><rect x="52" y="440" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="460.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">run.json</tspan></text><rect x="248" y="440" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="258" y="460.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="258">input.md</tspan></text><rect x="444" y="440" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="454" y="460.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="454">clarification.md</tspan></text><rect x="52" y="480" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="500.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">feature-spec.md</tspan></text><rect x="248" y="480" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="258" y="500.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="258">technical-plan.md</tspan></text><rect x="444" y="480" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="454" y="500.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="454">test-report.md</tspan></text><rect x="52" y="520" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="540.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">review.md</tspan></text><rect x="248" y="520" width="184" height="32" rx="7" class="f-plain" stroke-width="1"/><text x="258" y="540.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="258">delivery.md</tspan></text><rect x="444" y="520" width="184" height="32" rx="7" class="f-owner" stroke-width="1"/><text x="454" y="540.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-owner mono"><tspan x="454">decisions/</tspan></text><text x="680" y="426" font-size="13" font-weight="650" text-anchor="start" class="mono"><tspan x="680">scripts/</tspan></text><rect x="680" y="440" width="220" height="32" rx="7" class="f-check" stroke-width="1"/><text x="690" y="460.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-check mono"><tspan x="690">validate-gates.mjs</tspan></text><text x="680" y="488" font-size="11.5" font-weight="400" text-anchor="start" class="muted"><tspan x="680">gate check before every stage</tspan></text><rect x="680" y="500" width="220" height="32" rx="7" class="f-board" stroke-width="1"/><text x="690" y="520.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-board mono"><tspan x="690">render-run-board.mjs</tspan></text><text x="680" y="548" font-size="11.5" font-weight="400" text-anchor="start" class="muted"><tspan x="680">draws the board from the files</tspan></text><text x="926" y="426" font-size="13" font-weight="650" text-anchor="start"><tspan x="926">rules</tspan></text><rect x="926" y="440" width="202" height="32" rx="7" class="f-owner" stroke-width="1"/><text x="936" y="460.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-owner mono"><tspan x="936">.orchestra/project.md</tspan></text><text x="926" y="488" font-size="11.5" font-weight="400" text-anchor="start" class="muted"><tspan x="926">your product, read by every agent</tspan></text><rect x="926" y="500" width="202" height="32" rx="7" class="f-agent" stroke-width="1"/><text x="936" y="520.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-agent mono"><tspan x="936">.claude/  .github/</tspan></text><text x="926" y="548" font-size="11.5" font-weight="400" text-anchor="start" class="muted"><tspan x="926">agents, hooks, skills</tspan></text><path d="M384 340 L384 260" class="s-board" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-board)"/><text x="374" y="298" font-size="12" font-weight="400" text-anchor="end" class="muted"><tspan x="374">rendered from</tspan></text><text x="374" y="314" font-size="12" font-weight="400" text-anchor="end" class="muted"><tspan x="374">the run files</tspan></text><path d="M674 260 L674 340" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)" marker-start="url(#ah-ink)"/><text x="686" y="298" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="686">records decisions,</tspan></text><text x="686" y="314" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="686">updates run.json</tspan></text><path d="M997 274 L997 340" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><text x="1009" y="302" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="1009">specs, plans,</tspan></text><text x="1009" y="318" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="1009">code, tests</tspan></text><text x="32" y="606" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">The board decides nothing. A gate passes only on a person's decision or on real evidence: exit codes, CI runs, merged pull requests.</tspan></text>
</svg>
