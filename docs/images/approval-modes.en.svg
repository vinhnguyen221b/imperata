<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" role="img" aria-labelledby="t d">
<title id="t">Approval modes: local-record and pull-request</title><desc id="d">In local-record a decision file is the record; in pull-request each human gate is the merge of its own pull request.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="580" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">Two ways to pass a human gate</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">Each run declares its approvalMode in run.json. Start with local-record; move to pull-request once the roles work.</tspan></text><rect x="32" y="100" width="420" height="440" rx="14" class="f-repo" stroke-width="1.5"/><text x="52" y="132" font-size="17" font-weight="700" text-anchor="start" class="mono"><tspan x="52">local-record</tspan></text><text x="52" y="154" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="52">first pilot · no GitHub remote needed</tspan></text><rect x="72" y="176" width="340" height="54" rx="12" class="f-owner" stroke-width="1.5"/><text x="242" y="209" font-size="14" font-weight="650" text-anchor="middle" class="t-owner"><tspan x="242">You press Approve on the board</tspan></text><path d="M242 230 L242 254" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="72" y="258" width="340" height="54" rx="12" class="f-plain" stroke-width="1.5"/><text x="242" y="290" font-size="13" font-weight="600" text-anchor="middle" class="mono"><tspan x="242">decisions/&lt;time&gt;.md</tspan></text><path d="M242 312 L242 336" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="72" y="340" width="340" height="54" rx="12" class="f-plain" stroke-width="1.5"/><text x="242" y="372" font-size="12" font-weight="600" text-anchor="middle" class="mono"><tspan x="242">run.json  approvals.&lt;gate&gt;.recordPath</tspan></text><text x="52" y="428" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="52">Tests gate: the QA test report in the run folder.</tspan></text><rect x="52" y="446" width="380" height="74" rx="10" class="f-owner" stroke-width="1"/><text x="66" y="470" font-size="12.5" font-weight="400" text-anchor="start" class="t-owner"><tspan x="66">Nothing outside the repository confirms who</tspan><tspan x="66" dy="16.5">approved. The validator prints a warning, and the</tspan><tspan x="66" dy="16.5">delivery dossier says so.</tspan></text><rect x="472" y="100" width="676" height="440" rx="14" class="f-repo" stroke-width="1.5"/><text x="492" y="132" font-size="17" font-weight="700" text-anchor="start" class="mono"><tspan x="492">pull-request</tspan></text><text x="492" y="154" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="492">GitHub remote · gh signed in · protected main branch</tspan></text><path d="M500 330H1124" class="s-repo" stroke-width="5" stroke-linecap="round" style="stroke:var(--muted)"/><text x="500" y="356" font-size="12.5" font-weight="650" text-anchor="start" class="muted mono"><tspan x="500">main</tspan></text><path d="M508 330C528 330 518 230 548 230H632C662 230 652 330 672 330" class="s-agent" stroke-width="3" fill="none"/><circle cx="568" cy="230" r="6" class="f-agent" stroke-width="2"/><circle cx="604" cy="230" r="6" class="f-agent" stroke-width="2"/><text x="542" y="214" font-size="11.5" font-weight="650" text-anchor="start" class="t-agent mono"><tspan x="542">sdlc/&lt;runId&gt;/spec</tspan></text><text x="542" y="256" font-size="11" font-weight="400" text-anchor="start" class="muted"><tspan x="542">spec, clarification</tspan></text><circle cx="672" cy="330" r="11" class="f-owner" stroke-width="2"/><g class="m-owner"><circle cx="672" cy="328.48" r="2.8000000000000003"/><path d="M666.96 336.88a5.04 4.760000000000001 0 0 1 10.08 0z"/></g><text x="672" y="370" font-size="11.5" font-weight="400" text-anchor="middle" class="t-owner"><tspan x="672">merge =</tspan></text><text x="672" y="386" font-size="11.5" font-weight="650" text-anchor="middle" class="t-owner mono"><tspan x="672">businessApproval</tspan></text><path d="M704 330C724 330 714 230 744 230H828C858 230 848 330 868 330" class="s-agent" stroke-width="3" fill="none"/><circle cx="764" cy="230" r="6" class="f-agent" stroke-width="2"/><circle cx="800" cy="230" r="6" class="f-agent" stroke-width="2"/><text x="738" y="214" font-size="11.5" font-weight="650" text-anchor="start" class="t-agent mono"><tspan x="738">sdlc/&lt;runId&gt;/plan</tspan></text><text x="738" y="256" font-size="11" font-weight="400" text-anchor="start" class="muted"><tspan x="738">plan and tasks</tspan></text><circle cx="868" cy="330" r="11" class="f-owner" stroke-width="2"/><g class="m-owner"><circle cx="868" cy="328.48" r="2.8000000000000003"/><path d="M862.96 336.88a5.04 4.760000000000001 0 0 1 10.08 0z"/></g><text x="868" y="370" font-size="11.5" font-weight="400" text-anchor="middle" class="t-owner"><tspan x="868">merge =</tspan></text><text x="868" y="386" font-size="11.5" font-weight="650" text-anchor="middle" class="t-owner mono"><tspan x="868">planApproval</tspan></text><path d="M900 330C920 330 910 230 940 230H1036C1066 230 1056 330 1076 330" class="s-agent" stroke-width="3" fill="none"/><circle cx="960" cy="230" r="6" class="f-agent" stroke-width="2"/><circle cx="996" cy="230" r="6" class="f-agent" stroke-width="2"/><circle cx="1032" cy="230" r="6" class="f-agent" stroke-width="2"/><text x="934" y="214" font-size="11.5" font-weight="650" text-anchor="start" class="t-agent mono"><tspan x="934">sdlc/&lt;runId&gt;/delivery</tspan></text><text x="934" y="256" font-size="11" font-weight="400" text-anchor="start" class="muted"><tspan x="934">code, tests, review</tspan></text><circle cx="1076" cy="330" r="11" class="f-owner" stroke-width="2"/><g class="m-owner"><circle cx="1076" cy="328.48" r="2.8000000000000003"/><path d="M1070.96 336.88a5.04 4.760000000000001 0 0 1 10.08 0z"/></g><text x="1076" y="370" font-size="11.5" font-weight="400" text-anchor="middle" class="t-owner"><tspan x="1076">merge =</tspan></text><text x="1076" y="386" font-size="11.5" font-weight="650" text-anchor="middle" class="t-owner mono"><tspan x="1076">humanAcceptance</tspan></text><text x="934" y="274" font-size="11" font-weight="650" text-anchor="start" class="t-check"><tspan x="934">draft PR · CI = test evidence</tspan></text><text x="492" y="442" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="492">•  The Orchestrator pushes branches and opens pull requests only after you allow it. It never merges.</tspan></text><text x="492" y="468" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="492">•  validate-gates.mjs --verify-remote asks GitHub who merged each pull request and whether CI passed.</tspan></text><text x="492" y="494" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="492">•  Only the delivery pull request may close the tracker item (Closes #N); the others say Refs #N.</tspan></text>
</svg>
