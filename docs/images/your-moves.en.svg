<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="t d">
<title id="t">Your part of a run</title><desc id="d">The nine moves of the owner in one run: five commands, one round of answers and three approvals, with what the agents do and what the owner gets after each.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="900" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">Your part of a run: nine moves</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">Five commands, one round of answers and three approvals. The agents do the rest and keep it as files in the run folder.</tspan></text><text x="76" y="136" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="76">You send or decide</tspan></text><text x="462" y="136" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="462">The agents</tspan></text><text x="848" y="136" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="848">You get</tspan></text><text x="46" y="187" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">1</tspan></text><rect x="72" y="150" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="174" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="86">/imperata-start &lt;feature&gt;</tspan></text><text x="86" y="192" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">in a new Orchestrator session</tspan></text><rect x="458" y="150" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="174" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Business Analyst</tspan></text><text x="472" y="192" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">drafts the specification and lists what the</tspan><tspan x="472" dy="14.6">sources leave open</tspan></text><rect x="844" y="150" width="244" height="62" rx="10" class="f-board" stroke-width="1.5"/><text x="966" y="186" font-size="13" font-weight="650" text-anchor="middle" class="t-board"><tspan x="966">Question cards on the board</tspan></text><path d="M426 181 L454 181" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 181 L840 181" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="259" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">2</tspan></text><rect x="72" y="222" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="246" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="86">Answer the questions</tspan></text><text x="86" y="264" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">on the board; Send, then tell it "decisions sent"</tspan></text><rect x="458" y="222" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="246" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Orchestrator</tspan></text><text x="472" y="264" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">records each answer; the analyst completes the</tspan><tspan x="472" dy="14.6">specification</tspan></text><rect x="844" y="222" width="244" height="62" rx="10" class="f-board" stroke-width="1.5"/><text x="966" y="258" font-size="13" font-weight="650" text-anchor="middle" class="t-board"><tspan x="966">A specification to approve</tspan></text><path d="M426 253 L454 253" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 253 L840 253" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="331" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">3</tspan></text><rect x="72" y="294" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="318" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="86">Approve the specification</tspan></text><text x="86" y="336" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">or request changes, with a comment</tspan></text><rect x="458" y="294" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="318" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Orchestrator</tspan></text><text x="472" y="336" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">checks that you approved the version it has</tspan></text><rect x="844" y="294" width="244" height="62" rx="10" class="f-check" stroke-width="1.5"/><text x="966" y="330" font-size="13" font-weight="650" text-anchor="middle" class="t-check"><tspan x="966">Gate 1 · businessApproval</tspan></text><path d="M426 325 L454 325" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 325 L840 325" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="403" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">4</tspan></text><rect x="72" y="366" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="390" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="86">/imperata-plan &lt;runId&gt;</tspan></text><text x="86" y="408" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">in a new session</tspan></text><rect x="458" y="366" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="390" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Architect</tspan></text><text x="472" y="408" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">writes the plan: decisions, tasks, complexity,</tspan><tspan x="472" dy="14.6">skills</tspan></text><rect x="844" y="366" width="244" height="62" rx="10" class="f-board" stroke-width="1.5"/><text x="966" y="402" font-size="13" font-weight="650" text-anchor="middle" class="t-board"><tspan x="966">A plan to approve</tspan></text><path d="M426 397 L454 397" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 397 L840 397" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="475" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">5</tspan></text><rect x="72" y="438" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="462" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="86">Approve the plan</tspan></text><text x="86" y="480" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">its decisions are approved with it</tspan></text><rect x="458" y="438" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="462" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Orchestrator</tspan></text><text x="472" y="480" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">passes the gate on your decision, never on its own</tspan></text><rect x="844" y="438" width="244" height="62" rx="10" class="f-check" stroke-width="1.5"/><text x="966" y="474" font-size="13" font-weight="650" text-anchor="middle" class="t-check"><tspan x="966">Gate 2 · planApproval</tspan></text><path d="M426 469 L454 469" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 469 L840 469" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="547" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">6</tspan></text><rect x="72" y="510" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="534" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="86">/imperata-implement &lt;runId&gt;</tspan></text><text x="86" y="552" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">for each task: try it, then say go on</tspan></text><rect x="458" y="510" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="534" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Developer, then QA Engineer</tspan></text><text x="472" y="552" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">build one task and test the criteria it names</tspan></text><rect x="844" y="510" width="244" height="62" rx="10" class="f-board" stroke-width="1.5"/><text x="966" y="546" font-size="13" font-weight="650" text-anchor="middle" class="t-board"><tspan x="966">A task to try: its owner check</tspan></text><path d="M426 541 L454 541" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 541 L840 541" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="619" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">7</tspan></text><rect x="72" y="582" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="606" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="86">/imperata-verify &lt;runId&gt;</tspan></text><text x="86" y="624" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">after the last task, in a new session</tspan></text><rect x="458" y="582" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="606" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">QA Engineer, Code Reviewer</tspan></text><text x="472" y="624" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">whole suite, test lock, calibration, review</tspan></text><rect x="844" y="582" width="244" height="62" rx="10" class="f-board" stroke-width="1.5"/><text x="966" y="618" font-size="13" font-weight="650" text-anchor="middle" class="t-board"><tspan x="966">A delivery to accept</tspan></text><path d="M426 613 L454 613" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 613 L840 613" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="691" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">8</tspan></text><rect x="72" y="654" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="678" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="86">Accept the delivery</tspan></text><text x="86" y="696" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">after reading the dossier, tests and review</tspan></text><rect x="458" y="654" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="678" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Orchestrator</tspan></text><text x="472" y="696" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">records your acceptance</tspan></text><rect x="844" y="654" width="244" height="62" rx="10" class="f-check" stroke-width="1.5"/><text x="966" y="690" font-size="13" font-weight="650" text-anchor="middle" class="t-check"><tspan x="966">Gate 3 · humanAcceptance</tspan></text><path d="M426 685 L454 685" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 685 L840 685" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><text x="46" y="763" font-size="16" font-weight="700" text-anchor="middle" class="muted"><tspan x="46">9</tspan></text><rect x="72" y="726" width="350" height="62" rx="10" class="f-owner" stroke-width="1.5"/><text x="86" y="750" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="86">/imperata-merge &lt;runId&gt;</tspan></text><text x="86" y="768" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="86">pull-request mode: merge the pull request, then</tspan><tspan x="86" dy="14.6">/imperata-close</tspan></text><rect x="458" y="726" width="350" height="62" rx="10" class="f-agent" stroke-width="1.5"/><text x="472" y="750" font-size="13.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="472">Orchestrator</tspan></text><text x="472" y="768" font-size="12" font-weight="400" text-anchor="start" class="t-agent"><tspan x="472">merges at your word and records the merge</tspan></text><rect x="844" y="726" width="244" height="62" rx="10" class="f-check" stroke-width="1.5"/><text x="966" y="762" font-size="13" font-weight="650" text-anchor="middle" class="t-check mono"><tspan x="966">DONE</tspan></text><path d="M426 757 L454 757" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M812 757 L840 757" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="32" y="810" width="520" height="66" rx="10" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="48" y="834" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="48">Send each command but the first in a new Orchestrator session. The board</tspan><tspan x="48" dy="16.5">gives the command for the next step, with the run's ID filled in.</tspan></text><rect x="568" y="810" width="520" height="66" rx="10" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="834" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="584">On the light track there is no move 5: the plan has no approval of its</tspan><tspan x="584" dy="16.5">own. A bug starts with /imperata-bug instead of /imperata-start.</tspan></text>
</svg>
