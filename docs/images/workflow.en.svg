--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1280" height="530" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">One run, from requirement to Done</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">Seven steps, six gates. Three gates are yours; the other three pass only on evidence.</tspan></text><rect x="28" y="92" width="1224" height="34" rx="8" class="f-orch" stroke-width="1"/><text x="640" y="114" font-size="13" font-weight="600" text-anchor="middle" class="t-orch"><tspan x="640">Orchestrator: delegates each step, records the result, runs the gate validator before every stage change</tspan></text><rect x="28" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="40" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="40">1 · Analysis</tspan></text><text x="40" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="t-agent"><tspan x="40">Business Analyst</tspan></text><text x="40" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="40">feature-spec.md</tspan><tspan x="40" dy="15.2">clarification.md</tspan></text><path d="M28 302H184V348a12 12 0 0 1 -12 12H40a12 12 0 0 1 -12 -12z" class="f-owner" stroke-width="1.5"/><g class="m-owner"><circle cx="48" cy="320.4" r="4"/><path d="M40.8 332.4a7.199999999999999 6.800000000000001 0 0 1 14.399999999999999 0z"/></g><text x="64" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="64">businessApproval</tspan></text><text x="40" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-owner"><tspan x="40">you approve the spec</tspan></text><path d="M186 236 L204 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="206" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="218" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="218">2 · Design &amp; plan</tspan></text><text x="218" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="t-agent"><tspan x="218">Architect</tspan><tspan x="218" dy="16.5">(+ UX Designer for UI)</tspan></text><text x="218" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="218">technical-plan.md</tspan><tspan x="218" dy="15.2">(Complexity, Skills)</tspan></text><path d="M206 302H362V348a12 12 0 0 1 -12 12H218a12 12 0 0 1 -12 -12z" class="f-owner" stroke-width="1.5"/><g class="m-owner"><circle cx="226" cy="320.4" r="4"/><path d="M218.8 332.4a7.199999999999999 6.800000000000001 0 0 1 14.399999999999999 0z"/></g><text x="242" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="242">planApproval</tspan></text><text x="218" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-owner"><tspan x="218">you approve the plan</tspan></text><path d="M364 236 L382 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="384" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="396" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="396">3 ·</tspan><tspan x="396" dy="19.1">Implementation</tspan></text><text x="396" y="215" font-size="12.5" font-weight="600" text-anchor="start" class="t-agent"><tspan x="396">Developer</tspan></text><text x="396" y="261" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="396">code +</tspan><tspan x="396" dy="15.2">targeted tests</tspan></text><path d="M384 302H540V348a12 12 0 0 1 -12 12H396a12 12 0 0 1 -12 -12z" class="f-check" stroke-width="1.5"/><circle cx="404" cy="323" r="8" class="m-check"/><path d="M400.48 323l2.4 2.56 4.8-5.12" stroke="#fff" stroke-width="1.92" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-check mono"><tspan x="420">implementation</tspan></text><text x="396" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-check"><tspan x="396">build, typecheck, tests</tspan></text><path d="M542 236 L560 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="562" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="574" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="574">4 · Verification</tspan></text><text x="574" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="t-agent"><tspan x="574">QA Engineer</tspan></text><text x="574" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="574">test-plan.md</tspan><tspan x="574" dy="15.2">test-report.md</tspan></text><path d="M562 302H718V348a12 12 0 0 1 -12 12H574a12 12 0 0 1 -12 -12z" class="f-check" stroke-width="1.5"/><circle cx="582" cy="323" r="8" class="m-check"/><path d="M578.48 323l2.4 2.56 4.8-5.12" stroke="#fff" stroke-width="1.92" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-check mono"><tspan x="598">tests</tspan></text><text x="574" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-check"><tspan x="574">real runs; CI in PR mode</tspan></text><path d="M720 236 L738 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="740" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="752" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="752">5 · Review</tspan></text><text x="752" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="t-agent"><tspan x="752">Code Reviewer</tspan></text><text x="752" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="752">review.md</tspan></text><path d="M740 302H896V348a12 12 0 0 1 -12 12H752a12 12 0 0 1 -12 -12z" class="f-check" stroke-width="1.5"/><circle cx="760" cy="323" r="8" class="m-check"/><path d="M756.48 323l2.4 2.56 4.8-5.12" stroke="#fff" stroke-width="1.92" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="776" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-check mono"><tspan x="776">review</tspan></text><text x="752" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-check"><tspan x="752">no open blocker</tspan></text><path d="M898 236 L916 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="918" y="146" width="156" height="214" rx="12" class="f-owner" stroke-width="1.5"/><text x="930" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="930">6 · Acceptance</tspan></text><text x="930" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="t-owner"><tspan x="930">You</tspan></text><text x="930" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="930">delivery.md</tspan></text><path d="M918 302H1074V348a12 12 0 0 1 -12 12H930a12 12 0 0 1 -12 -12z" class="f-owner" stroke-width="1.5"/><g class="m-owner"><circle cx="938" cy="320.4" r="4"/><path d="M930.8 332.4a7.199999999999999 6.800000000000001 0 0 1 14.399999999999999 0z"/></g><text x="954" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-owner mono"><tspan x="954">humanAcceptance</tspan></text><text x="930" y="346" font-size="11" font-weight="400" text-anchor="start" class="t-owner"><tspan x="930">you accept</tspan></text><path d="M1076 236 L1094 236" class="a-ink" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="1096" y="146" width="156" height="214" rx="12" class="f-plain" stroke-width="1.5"/><text x="1108" y="172" font-size="14.5" font-weight="700" text-anchor="start"><tspan x="1108">7 · Done</tspan></text><text x="1108" y="196" font-size="12.5" font-weight="600" text-anchor="start" class="muted"><tspan x="1108">—</tspan></text><text x="1108" y="242" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="1108">delivery merged:</tspan><tspan x="1108" dy="15.2">PR or local merge</tspan></text><path d="M1096 302H1252V348a12 12 0 0 1 -12 12H1108a12 12 0 0 1 -12 -12z" class="f-check" stroke-width="1.5"/><circle cx="1116" cy="323" r="8" class="m-check"/><path d="M1112.48 323l2.4 2.56 4.8-5.12" stroke="#fff" stroke-width="1.92" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1132" y="326" font-size="11.5" font-weight="650" text-anchor="start" class="t-check mono"><tspan x="1132">DONE</tspan></text><path d="M818 360V394" class="s-danger" stroke-width="1.8" stroke-dasharray="6 5"/><path d="M640 360 L640 394 L462 394 L462 364" class="s-danger" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah-danger)"/><path d="M818 394H640" class="s-danger" stroke-width="1.8" stroke-dasharray="6 5"/><text x="640" y="418" font-size="12.5" font-weight="400" text-anchor="middle" class="t-danger"><tspan x="640">defect → scoped fix by the Developer, then the tests again · at most 2 automatic attempts, then BLOCKED and back to you</tspan></text><g class="m-owner"><circle cx="44" cy="466.4" r="4"/><path d="M36.8 478.4a7.199999999999999 6.800000000000001 0 0 1 14.399999999999999 0z"/></g><text x="62" y="475" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="62">a person decides; in pull-request mode, by merging the pull request</tspan></text><circle cx="674" cy="470" r="8" class="m-check"/><path d="M670.48 470l2.4 2.56 4.8-5.12" stroke="#fff" stroke-width="1.92" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="475" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="690">evidence decides: exit codes, test reports, CI</tspan></text><text x="32" y="506" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">A question that changes an acceptance criterion must be answered before businessApproval. Nothing reaches the main branch before independent tests and review.</tspan></text>
</svg>
