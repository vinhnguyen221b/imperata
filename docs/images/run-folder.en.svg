<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">Inside a run folder</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">sdlc/runs/&lt;runId&gt;/ is committed with the run. Every file follows a template in .orchestra/templates/.</tspan></text><text x="40" y="118" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="40">File</tspan></text><text x="300" y="118" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="300">Written by</tspan></text><text x="550" y="118" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="550">What it holds</tspan></text><text x="900" y="118" font-size="12" font-weight="700" text-anchor="start" class="muted"><tspan x="900">Used at gate</tspan></text><rect x="28" y="132" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="156" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">run.json</tspan></text><rect x="300" y="138" width="232" height="26" rx="7" class="f-orch" stroke-width="1"/><text x="310" y="155.32" font-size="12" font-weight="600" text-anchor="start" class="t-orch"><tspan x="310">Orchestrator</tspan></text><text x="550" y="156" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">stage, gate results, approvals, blockers</tspan></text><text x="900" y="156" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="900">every gate</tspan></text><text x="40" y="194" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">input.md</tspan></text><rect x="300" y="176" width="232" height="26" rx="7" class="f-orch" stroke-width="1"/><text x="310" y="193.32" font-size="12" font-weight="600" text-anchor="start" class="t-orch"><tspan x="310">Orchestrator</tspan></text><text x="550" y="194" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">the original request and its sources</tspan></text><text x="900" y="194" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="900">—</tspan></text><rect x="28" y="208" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="232" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">clarification.md</tspan></text><rect x="300" y="214" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="231.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">BA drafts, Orchestrator records</tspan></text><text x="550" y="232" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">questions, options, your decisions</tspan></text><text x="900" y="232" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">businessApproval</tspan></text><text x="40" y="270" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">feature-spec.md</tspan></text><rect x="300" y="252" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="269.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">Orchestrator, from the BA</tspan></text><text x="550" y="270" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">business rules, acceptance criteria</tspan></text><text x="900" y="270" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">businessApproval</tspan></text><rect x="28" y="284" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="308" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">design.md</tspan></text><rect x="300" y="290" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="307.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">Orchestrator, from the UX Designer</tspan></text><text x="550" y="308" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">flows, states, Figma links, or N/A</tspan></text><text x="900" y="308" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">planApproval</tspan></text><text x="40" y="346" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">technical-plan.md</tspan></text><rect x="300" y="328" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="345.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">Orchestrator, from the Architect</tspan></text><text x="550" y="346" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">tasks with Complexity and Skills</tspan></text><text x="900" y="346" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">planApproval</tspan></text><rect x="28" y="360" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="384" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">test-plan.md · test-report.md</tspan></text><rect x="300" y="366" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="383.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">QA Engineer</tspan></text><text x="550" y="384" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">test matrix; real commands, exit codes</tspan></text><text x="900" y="384" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">tests</tspan></text><text x="40" y="422" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">review.md</tspan></text><rect x="300" y="404" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="421.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">Orchestrator, from the Reviewer</tspan></text><text x="550" y="422" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">findings and what was done with each</tspan></text><text x="900" y="422" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">review</tspan></text><rect x="28" y="436" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="460" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">delivery.md</tspan></text><rect x="300" y="442" width="232" height="26" rx="7" class="f-orch" stroke-width="1"/><text x="310" y="459.32" font-size="12" font-weight="600" text-anchor="start" class="t-orch"><tspan x="310">Orchestrator</tspan></text><text x="550" y="460" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">traceability, model per task, proven / unproven</tspan></text><text x="900" y="460" font-size="12" font-weight="400" text-anchor="start" class="muted mono"><tspan x="900">humanAcceptance</tspan></text><text x="40" y="498" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">evidence/</tspan></text><rect x="300" y="480" width="232" height="26" rx="7" class="f-agent" stroke-width="1"/><text x="310" y="497.32" font-size="12" font-weight="600" text-anchor="start" class="t-agent"><tspan x="310">QA, Developer, lock-tests.mjs</tspan></text><text x="550" y="498" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">logs, JUnit, traces, test lock, calibration, diff</tspan></text><text x="900" y="498" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="900">tests · review</tspan></text><rect x="28" y="512" width="1024" height="38" rx="6" class="f-repo" stroke-width="0"/><text x="40" y="536" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">decisions/</tspan></text><rect x="300" y="518" width="232" height="26" rx="7" class="f-owner" stroke-width="1"/><text x="310" y="535.32" font-size="12" font-weight="600" text-anchor="start" class="t-owner"><tspan x="310">board-server.mjs only</tspan></text><text x="550" y="536" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">your replies, verbatim</tspan></text><text x="900" y="536" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="900">your gates</tspan></text><text x="40" y="574" font-size="12.5" font-weight="600" text-anchor="start" class="mono"><tspan x="40">board.md</tspan></text><rect x="300" y="556" width="232" height="26" rx="7" class="f-board" stroke-width="1"/><text x="310" y="573.32" font-size="12" font-weight="600" text-anchor="start" class="t-board"><tspan x="310">render-run-board.mjs</tspan></text><text x="550" y="574" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="550">the board as Mermaid, for pull requests</tspan></text><text x="900" y="574" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="900">—</tspan></text><text x="40" y="632" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="40">Next to the runs: sdlc/board.html, the live board page. It is generated and not committed.</tspan></text><text x="40" y="654" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="40">In Claude Code, hooks keep an agent's file edits out of decisions/ and the QA Engineer's to test files and the run folder.</tspan></text>
