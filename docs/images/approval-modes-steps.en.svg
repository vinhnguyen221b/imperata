<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="t d">
<title id="t">Approval modes, step by step</title><desc id="d">The five steps of a run in local-record mode and in pull-request mode: what you do at each gate, what passes the tests gate, and when to choose each mode.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="668" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">local-record or pull-request: the same run, step by step</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">The agents do the same work in both modes. What changes is how each gate is passed, and where the proof of it lives.</tspan></text><rect x="196" y="96" width="184" height="46" rx="9" class="f-repo" stroke-width="1"/><text x="208" y="115" font-size="13" font-weight="700" text-anchor="start"><tspan x="208">1 · Specification</tspan></text><text x="208" y="133" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="208">businessApproval</tspan></text><rect x="393" y="96" width="184" height="46" rx="9" class="f-repo" stroke-width="1"/><text x="405" y="115" font-size="13" font-weight="700" text-anchor="start"><tspan x="405">2 · Plan</tspan></text><text x="405" y="133" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="405">planApproval</tspan></text><rect x="590" y="96" width="184" height="46" rx="9" class="f-repo" stroke-width="1"/><text x="602" y="115" font-size="13" font-weight="700" text-anchor="start"><tspan x="602">3 · Tests</tspan></text><text x="602" y="133" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="602">tests</tspan></text><rect x="787" y="96" width="184" height="46" rx="9" class="f-repo" stroke-width="1"/><text x="799" y="115" font-size="13" font-weight="700" text-anchor="start"><tspan x="799">4 · Delivery</tspan></text><text x="799" y="133" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="799">humanAcceptance</tspan></text><rect x="984" y="96" width="184" height="46" rx="9" class="f-repo" stroke-width="1"/><text x="996" y="115" font-size="13" font-weight="700" text-anchor="start"><tspan x="996">5 · Done</tspan></text><text x="996" y="133" font-size="11.5" font-weight="400" text-anchor="start" class="muted mono"><tspan x="996">DONE</tspan></text><path d="M196 154 L1168 154" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="32" y="168" width="152" height="116" rx="12" class="f-repo" stroke-width="1.5"/><text x="46" y="200" font-size="15" font-weight="700" text-anchor="start" class="mono"><tspan x="46">local-record</tspan></text><text x="46" y="224" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="46">A gate passes on</tspan></text><text x="46" y="242" font-size="12.5" font-weight="600" text-anchor="start"><tspan x="46">your decision,</tspan><tspan x="46" dy="16.5">saved in the</tspan><tspan x="46" dy="16.5">repository</tspan></text><rect x="196" y="168" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="208" y="194" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="208">You press Approve on</tspan><tspan x="208" dy="17.8">the board</tspan></text><text x="208" y="231.05" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="208">saved in decisions/;</tspan><tspan x="208" dy="15.8">run.json points at it</tspan></text><rect x="393" y="168" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="405" y="194" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="405">You press Approve on</tspan><tspan x="405" dy="17.8">the board</tspan></text><text x="405" y="231.05" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="405">for the version of the</tspan><tspan x="405" dy="15.8">plan you saw</tspan></text><rect x="590" y="168" width="184" height="116" rx="12" class="f-check" stroke-width="1.5"/><text x="602" y="194" font-size="13.5" font-weight="650" text-anchor="start" class="t-check"><tspan x="602">QA runs the tests</tspan><tspan x="602" dy="17.8">locally</tspan></text><text x="602" y="231.05" font-size="12" font-weight="400" text-anchor="start" class="t-check"><tspan x="602">the test report in the</tspan><tspan x="602" dy="15.8">run folder is the</tspan><tspan x="602" dy="15.8">evidence</tspan></text><rect x="787" y="168" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="799" y="194" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="799">You press Approve on</tspan><tspan x="799" dy="17.8">the board</tspan></text><text x="799" y="231.05" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="799">the run is Accepted, not</tspan><tspan x="799" dy="15.8">yet merged</tspan></text><rect x="984" y="168" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="996" y="194" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="996">You merge into main,</tspan><tspan x="996" dy="17.8">or send</tspan><tspan x="996" dy="17.8">/imperata-merge</tspan></text><text x="996" y="248.6" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="996">git confirms the commit</tspan><tspan x="996" dy="15.8">is on main</tspan></text><rect x="196" y="294" width="972" height="46" rx="9" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="210" y="313" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="210">Nothing is pushed and no pull request is opened. Nothing outside the repository confirms who approved: the gate check warns, and the delivery</tspan><tspan x="210" dy="16.5">says so.</tspan></text><rect x="32" y="356" width="152" height="116" rx="12" class="f-repo" stroke-width="1.5"/><text x="46" y="388" font-size="15" font-weight="700" text-anchor="start" class="mono"><tspan x="46">pull-request</tspan></text><text x="46" y="412" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="46">A gate passes on</tspan></text><text x="46" y="430" font-size="12.5" font-weight="600" text-anchor="start"><tspan x="46">your merge of a</tspan><tspan x="46" dy="16.5">pull request on</tspan><tspan x="46" dy="16.5">GitHub</tspan></text><rect x="196" y="356" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="208" y="382" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="208">You merge the spec</tspan><tspan x="208" dy="17.8">pull request</tspan></text><text x="208" y="419.05" font-size="11" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="208">sdlc/&lt;runId&gt;/spec</tspan></text><rect x="393" y="356" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="405" y="382" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="405">You merge the plan</tspan><tspan x="405" dy="17.8">pull request</tspan></text><text x="405" y="419.05" font-size="11" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="405">sdlc/&lt;runId&gt;/plan</tspan></text><rect x="590" y="356" width="184" height="116" rx="12" class="f-check" stroke-width="1.5"/><text x="602" y="382" font-size="13.5" font-weight="650" text-anchor="start" class="t-check"><tspan x="602">CI passes on the</tspan><tspan x="602" dy="17.8">delivery pull request</tspan></text><text x="602" y="419.05" font-size="12" font-weight="400" text-anchor="start" class="t-check"><tspan x="602">a draft until tests and</tspan><tspan x="602" dy="15.8">review pass</tspan></text><rect x="787" y="356" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="799" y="382" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="799">You merge the delivery</tspan><tspan x="799" dy="17.8">pull request</tspan></text><text x="799" y="419.05" font-size="11" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="799">sdlc/&lt;runId&gt;/delivery</tspan></text><rect x="984" y="356" width="184" height="116" rx="12" class="f-owner" stroke-width="1.5"/><text x="996" y="382" font-size="13.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="996">You send</tspan><tspan x="996" dy="17.8">/imperata-close</tspan></text><text x="996" y="419.05" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="996">the Orchestrator records</tspan><tspan x="996" dy="15.8">DONE</tspan></text><rect x="196" y="482" width="972" height="46" rx="9" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="210" y="501" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="210">The Orchestrator pushes three branches and opens three pull requests, only with your permission, and never merges. GitHub records who merged</tspan><tspan x="210" dy="16.5">each one; --verify-remote checks it.</tspan></text><rect x="32" y="544" width="560" height="96" rx="12" class="f-plain" stroke-width="1.5"/><text x="46" y="572" font-size="14" font-weight="650" text-anchor="start" class="t-plain"><tspan x="46">Choose local-record for</tspan></text><text x="46" y="592" font-size="12.5" font-weight="400" text-anchor="start" class="t-plain"><tspan x="46">your first runs · a repository with no GitHub remote · when pushes are not</tspan><tspan x="46" dy="16.5">allowed · a security fix that must stay unpublished until it is accepted</tspan></text><rect x="608" y="544" width="560" height="96" rx="12" class="f-plain" stroke-width="1.5"/><text x="622" y="572" font-size="14" font-weight="650" text-anchor="start" class="t-plain"><tspan x="622">Choose pull-request for</tspan></text><text x="622" y="592" font-size="12.5" font-weight="400" text-anchor="start" class="t-plain"><tspan x="622">a GitHub remote with gh signed in · you allow the Orchestrator to push and open</tspan><tspan x="622" dy="16.5">pull requests · a main branch only a person can merge · the required CI checks</tspan><tspan x="622" dy="16.5">set up</tspan></text>
</svg>
