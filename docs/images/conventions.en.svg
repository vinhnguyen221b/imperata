<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="668" viewBox="0 0 1120 668" role="img" aria-labelledby="t d">
<title id="t">Conventions and who reads them</title><desc id="d">The team's document, the linter and the project profile on the left; the stack skill in the middle; on the right the Business Analyst, the Architect, the Developer and the QA Engineer, the Code Reviewer and the gate check, each with what it does with a rule.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="668" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">Your conventions: written once, read at every step</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">A stack skill holds the rules of one stack. A team's coding convention enters a project through it.</tspan></text><rect x="32" y="104" width="304" height="112" rx="12" class="f-repo" stroke-width="1.5"/><text x="46" y="132" font-size="15" font-weight="650" text-anchor="start" class="t-repo"><tspan x="46">The team's document</tspan></text><text x="46" y="153" font-size="12.5" font-weight="400" text-anchor="start" class="t-repo"><tspan x="46">references/&lt;convention&gt;.md, kept as the</tspan><tspan x="46" dy="16.5">team wrote it: the reason and an example</tspan><tspan x="46" dy="16.5">for each rule.</tspan></text><rect x="32" y="240" width="304" height="112" rx="12" class="f-repo" stroke-width="1.5"/><text x="46" y="268" font-size="15" font-weight="650" text-anchor="start" class="t-repo"><tspan x="46">The linter</tspan></text><text x="46" y="289" font-size="12.5" font-weight="400" text-anchor="start" class="t-repo"><tspan x="46">Checks the rules a script can check. Its</tspan><tspan x="46" dy="16.5">command stands in the skill, and the</tspan><tspan x="46" dy="16.5">Developer runs it for each task.</tspan></text><rect x="32" y="376" width="304" height="130" rx="12" class="f-owner" stroke-width="1.5"/><text x="46" y="404" font-size="15" font-weight="650" text-anchor="start" class="t-owner"><tspan x="46">The project profile</tspan></text><text x="46" y="425" font-size="12.5" font-weight="400" text-anchor="start" class="t-owner"><tspan x="46">.orchestra/project.md says that the</tspan><tspan x="46" dy="16.5">convention holds and where it is, and</tspan><tspan x="46" dy="16.5">names the security-sensitive areas. Every</tspan><tspan x="46" dy="16.5">agent reads it first.</tspan></text><rect x="396" y="150" width="300" height="310" rx="12" class="f-board" stroke-width="1.5"/><text x="412" y="180" font-size="15" font-weight="650" text-anchor="start" class="t-board mono"><tspan x="412">&lt;stack&gt;/SKILL.md</tspan></text><text x="412" y="202" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="412">the stack skill</tspan></text><circle cx="418" cy="230" r="3" class="m-board"/><text x="430" y="234" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="430">Where things live</tspan></text><circle cx="418" cy="258.5" r="3" class="m-board"/><text x="430" y="262.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="430">Conventions: one sentence for each</tspan><tspan x="430" dy="16.5">rule, under the team's numbers</tspan></text><circle cx="418" cy="303.5" r="3" class="m-board"/><text x="430" y="307.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="430">Commands: lint, tests, one test file</tspan></text><circle cx="418" cy="332" r="3" class="m-board"/><text x="430" y="336" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="430">Review points: the security rules</tspan></text><circle cx="418" cy="360.5" r="3" class="m-board"/><text x="430" y="364.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="430">References: which file to read, and</tspan><tspan x="430" dy="16.5">when</tspan></text><text x="546" y="484" font-size="12" font-weight="400" text-anchor="middle" class="muted"><tspan x="546">.claude/skills/ for Claude Code, .github/skills/</tspan><tspan x="546" dy="15.8">for Copilot: the same skill in both.</tspan></text><rect x="760" y="104" width="328" height="84" rx="12" class="f-agent" stroke-width="1.5"/><text x="774" y="130" font-size="14.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="774">Business Analyst</tspan></text><text x="774" y="150.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="774">takes a rule as decided: an approved</tspan><tspan x="774" dy="16.5">constraint, never a question for you</tspan></text><path d="M700 210 L756 146" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><rect x="760" y="200" width="328" height="84" rx="12" class="f-agent" stroke-width="1.5"/><text x="774" y="226" font-size="14.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="774">Architect</tspan></text><text x="774" y="246.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="774">names the skill in the Skills field of every</tspan><tspan x="774" dy="16.5">task of the plan</tspan></text><path d="M700 258 L756 242" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><rect x="760" y="296" width="328" height="84" rx="12" class="f-agent" stroke-width="1.5"/><text x="774" y="322" font-size="14.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="774">Developer · QA Engineer</tspan></text><text x="774" y="342.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="774">read it for each task; the Developer quotes</tspan><tspan x="774" dy="16.5">the rule that shaped the code</tspan></text><path d="M700 306 L756 338" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><rect x="760" y="392" width="328" height="84" rx="12" class="f-agent" stroke-width="1.5"/><text x="774" y="418" font-size="14.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="774">Code Reviewer</tspan></text><text x="774" y="438.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="774">checks the patch against the review points; a</tspan><tspan x="774" dy="16.5">finding names the rule</tspan></text><path d="M700 354 L756 434" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><rect x="760" y="488" width="328" height="84" rx="12" class="f-check" stroke-width="1.5"/><text x="774" y="514" font-size="14.5" font-weight="650" text-anchor="start" class="t-check"><tspan x="774">Gate check</tspan></text><text x="774" y="534.5" font-size="12.5" font-weight="400" text-anchor="start" class="t-check"><tspan x="774">looks every quoted rule up in the skill file,</tspan><tspan x="774" dy="16.5">word for word</tspan></text><path d="M700 402 L756 530" class="s-check" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-check)"/><path d="M340 160 L392 210" class="s-board" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-board)"/><path d="M392 340 L340 296" class="s-board" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah-board)"/><rect x="32" y="596" width="1056" height="50" rx="10" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="48" y="626" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="48">A rule written in neither the skill nor the profile reaches nobody. Keep SKILL.md short, since it is read for every task, and put the depth under references/.</tspan></text>
</svg>
