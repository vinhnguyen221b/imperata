<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="t d">
<title id="t">The decision loop</title><desc id="d">Agents draft questions, the board shows them, you decide and send, the Orchestrator records and continues.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1120" height="660" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">How you decide: the loop at every gate</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">You never edit run files. You answer on the board; the Orchestrator records what you sent.</tspan></text><rect x="420" y="100" width="280" height="112" rx="12" class="f-agent" stroke-width="1.5"/><text x="434" y="128" font-size="15" font-weight="650" text-anchor="start" class="t-agent"><tspan x="434">1 · Agents draft</tspan></text><text x="434" y="149" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="434">The Business Analyst drafts the spec</tspan><tspan x="434" dy="16.5">and lists what the sources leave open,</tspan><tspan x="434" dy="16.5">with options; the Orchestrator saves</tspan><tspan x="434" dy="16.5">them in the run folder.</tspan></text><rect x="800" y="236" width="280" height="112" rx="12" class="f-board" stroke-width="1.5"/><text x="814" y="264" font-size="15" font-weight="650" text-anchor="start" class="t-board"><tspan x="814">2 · The board shows them</tspan></text><text x="814" y="285" font-size="12.5" font-weight="400" text-anchor="start" class="t-board"><tspan x="814">render-run-board.mjs turns the run</tspan><tspan x="814" dy="16.5">files into question cards and, at your</tspan><tspan x="814" dy="16.5">gate, an approval card.</tspan></text><rect x="660" y="434" width="280" height="112" rx="12" class="f-owner" stroke-width="1.5"/><text x="674" y="462" font-size="15" font-weight="650" text-anchor="start" class="t-owner"><tspan x="674">3 · You decide</tspan></text><text x="674" y="483" font-size="12.5" font-weight="400" text-anchor="start" class="t-owner"><tspan x="674">One card at a time: pick an option</tspan><tspan x="674" dy="16.5">(keys 1–9) or write your own. Then</tspan><tspan x="674" dy="16.5">Approve or Request changes.</tspan></text><rect x="180" y="434" width="280" height="112" rx="12" class="f-repo" stroke-width="1.5"/><text x="194" y="462" font-size="15" font-weight="650" text-anchor="start" class="t-repo"><tspan x="194">4 · Send to Orchestrator</tspan></text><text x="194" y="483" font-size="12.5" font-weight="400" text-anchor="start" class="t-repo"><tspan x="194">board-server.mjs saves your reply</tspan><tspan x="194" dy="16.5">verbatim as decisions/&lt;time&gt;.md. No</tspan><tspan x="194" dy="16.5">agent may write there.</tspan></text><rect x="40" y="236" width="280" height="112" rx="12" class="f-agent" stroke-width="1.5"/><text x="54" y="264" font-size="15" font-weight="650" text-anchor="start" class="t-agent"><tspan x="54">5 · The Orchestrator records</tspan></text><text x="54" y="285" font-size="12.5" font-weight="400" text-anchor="start" class="t-agent"><tspan x="54">It cites the file in clarification.md,</tspan><tspan x="54" dy="16.5">updates run.json, checks the version</tspan><tspan x="54" dy="16.5">you approved and moves to the next</tspan><tspan x="54" dy="16.5">step.</tspan></text><path d="M700 156 Q940 160 945 230" class="s-board" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-board)"/><path d="M1010 348 Q1010 400 945 428" class="s-owner" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-owner)"/><path d="M656 490 L550 490 L464 490" class="a-ink" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M250 428 Q180 400 180 352" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><path d="M180 232 Q200 160 414 156" class="s-agent" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah-agent)"/><text x="560" y="330" font-size="22" font-weight="700" text-anchor="middle" class="muted"><tspan x="560">one loop</tspan></text><text x="560" y="358" font-size="22" font-weight="700" text-anchor="middle" class="muted"><tspan x="560">per gate</tspan></text><rect x="32" y="572" width="520" height="66" rx="10" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="48" y="596" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="48">No server? Open sdlc/board.html as a file, press Copy reply and paste it</tspan><tspan x="48" dy="16.5">into the Orchestrator session.</tspan></text><rect x="568" y="572" width="520" height="66" rx="10" class="f-plain" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="596" font-size="12.5" font-weight="400" text-anchor="start"><tspan x="584">board-server.mjs --auto-run claude|copilot: each Send starts a fresh,</tspan><tspan x="584" dy="16.5">non-interactive Orchestrator that stops at the next human gate.</tspan></text>
</svg>
