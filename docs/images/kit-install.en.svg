<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="t d">
<title id="t">Installing the Imperata kit</title><desc id="d">imperata-kit.mjs copies kit files from the kit's repository into a project, keeps the project-owned files, and records the install.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
svg{--bg:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--arrow:#59636e;
--owner-f:#fff4d6;--owner-s:#d4a72c;--owner-t:#6c4400;
--agent-f:#ddf4ff;--agent-s:#54aeff;--agent-t:#0a3069;
--orch-f:#0969da;--orch-s:#0969da;--orch-t:#ffffff;
--check-f:#dafbe1;--check-s:#4ac26b;--check-t:#0f4a1f;
--board-f:#fbefff;--board-s:#c297ff;--board-t:#3e1f79;
--repo-f:#f6f8fa;--repo-s:#d1d9e0;--repo-t:#1f2328;
--danger-f:#ffebe9;--danger-s:#cf222e;--danger-t:#82071e;
--plain-f:#ffffff;--plain-s:#d1d9e0;--plain-t:#1f2328}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--arrow:#9198a1;
--owner-f:#3b2a05;--owner-s:#bb8009;--owner-t:#f2cc60;
--agent-f:#0c2d6b;--agent-s:#1f6feb;--agent-t:#cae8ff;
--orch-f:#1f6feb;--orch-s:#388bfd;--orch-t:#ffffff;
--check-f:#0b3a1c;--check-s:#2ea043;--check-t:#aff5b4;
--board-f:#2b1659;--board-s:#8957e5;--board-t:#e2d1ff;
--repo-f:#151b23;--repo-s:#3d444d;--repo-t:#e6edf3;
--danger-f:#3c0d0d;--danger-s:#f85149;--danger-t:#ffdcd7;
--plain-f:#0d1117;--plain-s:#3d444d;--plain-t:#e6edf3}}
.bg{fill:var(--bg)}
.muted{fill:var(--muted)}
.line{stroke:var(--line);fill:none}
.f-owner{fill:var(--owner-f);stroke:var(--owner-s)}.t-owner{fill:var(--owner-t)}.s-owner{stroke:var(--owner-s);fill:none}.m-owner{fill:var(--owner-s)}
.f-agent{fill:var(--agent-f);stroke:var(--agent-s)}.t-agent{fill:var(--agent-t)}.s-agent{stroke:var(--agent-s);fill:none}.m-agent{fill:var(--agent-s)}
.f-orch{fill:var(--orch-f);stroke:var(--orch-s)}.t-orch{fill:var(--orch-t)}.s-orch{stroke:var(--orch-s);fill:none}.m-orch{fill:var(--orch-s)}
.f-check{fill:var(--check-f);stroke:var(--check-s)}.t-check{fill:var(--check-t)}.s-check{stroke:var(--check-s);fill:none}.m-check{fill:var(--check-s)}
.f-board{fill:var(--board-f);stroke:var(--board-s)}.t-board{fill:var(--board-t)}.s-board{stroke:var(--board-s);fill:none}.m-board{fill:var(--board-s)}
.f-repo{fill:var(--repo-f);stroke:var(--repo-s)}.t-repo{fill:var(--repo-t)}.s-repo{stroke:var(--repo-s);fill:none}.m-repo{fill:var(--repo-s)}
.f-danger{fill:var(--danger-f);stroke:var(--danger-s)}.t-danger{fill:var(--danger-t)}.s-danger{stroke:var(--danger-s);fill:none}.m-danger{fill:var(--danger-s)}
.f-plain{fill:var(--plain-f);stroke:var(--plain-s)}.t-plain{fill:var(--plain-t)}.s-plain{stroke:var(--plain-s);fill:none}.m-plain{fill:var(--plain-s)}
.a-ink{stroke:var(--arrow);fill:none}.m-ink{fill:var(--arrow)}
</style>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-ink"/></marker><marker id="ah-owner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-owner"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-agent"/></marker><marker id="ah-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-orch"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-check"/></marker><marker id="ah-board" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-board"/></marker><marker id="ah-repo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-repo"/></marker><marker id="ah-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-danger"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="m-plain"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="620" rx="16"/>
<text x="32" y="46" font-size="21" font-weight="700" text-anchor="start"><tspan x="32">Install the kit into any project</tspan></text><text x="32" y="72" font-size="13.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">The kit stays in its own folder. imperata-kit.mjs copies only what a project needs and records what it installed.</tspan></text><rect x="32" y="104" width="340" height="420" rx="14" class="f-repo" stroke-width="1.5"/><text x="52" y="136" font-size="17" font-weight="700" text-anchor="start" class="mono"><tspan x="52">imperata</tspan></text><text x="52" y="158" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="52">this repository, cloned once per machine</tspan></text><rect x="52" y="196" width="300" height="30" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="215.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">kit.json</tspan></text><text x="56" y="244" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="56">what goes where, for which tool</tspan></text><rect x="52" y="258" width="300" height="30" rx="7" class="f-orch" stroke-width="1"/><text x="62" y="277.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-orch mono"><tspan x="62">imperata-kit.mjs</tspan></text><text x="56" y="306" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="56">install · status · update</tspan></text><rect x="52" y="320" width="300" height="30" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="339.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">starter/</tspan></text><text x="56" y="368" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="56">shared parts and the Copilot layer</tspan></text><rect x="52" y="382" width="300" height="30" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="401.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">starter-claude-code/</tspan></text><text x="56" y="430" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="56">the Claude Code layer</tspan></text><rect x="52" y="444" width="300" height="30" rx="7" class="f-plain" stroke-width="1"/><text x="62" y="463.5" font-size="12.5" font-weight="500" text-anchor="start" class="t-plain mono"><tspan x="62">docs/</tspan></text><text x="56" y="492" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="56">blueprint, guides, images</tspan></text><text x="548" y="140" font-size="14" font-weight="650" text-anchor="middle" class="mono"><tspan x="548">node imperata-kit.mjs</tspan></text><rect x="396" y="170" width="304" height="34" rx="7" class="f-orch" stroke-width="1"/><text x="406" y="191.32" font-size="12" font-weight="500" text-anchor="start" class="t-orch mono"><tspan x="406">install &lt;repo&gt; --tools claude,copilot</tspan></text><text x="400" y="224" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="400">first time; add --dry-run to preview</tspan></text><rect x="396" y="262" width="304" height="34" rx="7" class="f-agent" stroke-width="1"/><text x="406" y="283.32" font-size="12" font-weight="500" text-anchor="start" class="t-agent mono"><tspan x="406">status &lt;repo&gt;</tspan></text><text x="400" y="316" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="400">what an update would change; writes nothing</tspan></text><rect x="396" y="354" width="304" height="34" rx="7" class="f-agent" stroke-width="1"/><text x="406" y="375.32" font-size="12" font-weight="500" text-anchor="start" class="t-agent mono"><tspan x="406">update &lt;repo&gt;</tspan></text><text x="400" y="408" font-size="12" font-weight="400" text-anchor="start" class="muted"><tspan x="400">replaces only kit files you did not change</tspan></text><path d="M372 314 L392 314" class="a-ink" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><path d="M704 314 L728 314" class="a-ink" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="742" y="112" width="418" height="424" rx="14" class="f-repo" stroke-width="1.5"/><rect x="732" y="104" width="418" height="424" rx="14" class="f-plain" stroke-width="1.5"/><text x="752" y="136" font-size="16" font-weight="700" text-anchor="start"><tspan x="752">your project repository</tspan></text><text x="752" y="158" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="752">as many projects as you like</tspan></text><rect x="752" y="172" width="378" height="150" rx="10" class="f-agent" stroke-width="1"/><text x="766" y="194" font-size="12.5" font-weight="650" text-anchor="start" class="t-agent"><tspan x="766">Kit files: replaced on update, unless you changed them</tspan></text><text x="766" y="218" font-size="12" font-weight="400" text-anchor="start" class="t-agent mono"><tspan x="766">.claude/  agents · hooks · skills</tspan></text><text x="766" y="239" font-size="12" font-weight="400" text-anchor="start" class="t-agent mono"><tspan x="766">.github/  agents · skills · instructions</tspan></text><text x="766" y="260" font-size="12" font-weight="400" text-anchor="start" class="t-agent mono"><tspan x="766">scripts/  validate · render · board-server</tspan></text><text x="766" y="281" font-size="12" font-weight="400" text-anchor="start" class="t-agent mono"><tspan x="766">.orchestra/  schemas · templates · guide</tspan></text><text x="766" y="302" font-size="12" font-weight="400" text-anchor="start" class="t-agent mono"><tspan x="766">/imperata-*  commands, as skills</tspan></text><rect x="752" y="332" width="378" height="132" rx="10" class="f-owner" stroke-width="1"/><text x="766" y="354" font-size="12.5" font-weight="650" text-anchor="start" class="t-owner"><tspan x="766">Yours: never overwritten</tspan></text><text x="766" y="378" font-size="12" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="766">.orchestra/project.md</tspan></text><text x="950" y="378" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="950">← fill this in</tspan></text><text x="766" y="399" font-size="12" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="766">CLAUDE.md</tspan></text><text x="950" y="399" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="950">+ 2 import lines</tspan></text><text x="766" y="420" font-size="12" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="766">.claude/settings.json</tspan></text><text x="950" y="420" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="950">missing rules added</tspan></text><text x="766" y="441" font-size="12" font-weight="400" text-anchor="start" class="t-owner mono"><tspan x="766">.gitignore</tspan></text><text x="950" y="441" font-size="12" font-weight="400" text-anchor="start" class="t-owner"><tspan x="950">missing lines added</tspan></text><rect x="752" y="474" width="378" height="42" rx="10" class="f-check" stroke-width="1"/><text x="766" y="500" font-size="12" font-weight="400" text-anchor="start" class="t-check mono"><tspan x="766">.orchestra/installed.json</tspan></text><text x="960" y="500" font-size="12" font-weight="400" text-anchor="start" class="t-check"><tspan x="960">version + hash per file</tspan></text><text x="32" y="570" font-size="13" font-weight="600" text-anchor="start"><tspan x="32">Never copy the kit's repository into a project, and never put product documents in it.</tspan></text><text x="32" y="594" font-size="12.5" font-weight="400" text-anchor="start" class="muted"><tspan x="32">The installer commits nothing: review the result with git status and git diff, then commit it in the project.</tspan></text>
</svg>
